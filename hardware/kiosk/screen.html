<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:1920px;font-family:Nunito,Inter,sans-serif;color:#1a1a2e;
background:radial-gradient(ellipse at top,#EDE7FF 0%,#FEFCFF 45%,#FFE9F2 100%);display:flex;flex-direction:column;align-items:center;padding:90px 80px;overflow:hidden}
.logo{font-family:Fredoka;font-weight:700;font-size:92px;background:linear-gradient(135deg,#7C5CFC,#FF6B9D);-webkit-background-clip:text;color:transparent}
.sub{font-size:40px;font-weight:800;opacity:.55;margin-top:6px}
.card{margin-top:70px;width:880px;height:880px;border-radius:70px;background:repeating-conic-gradient(#f3effd 0 25%,#fff 0 50%) 0 0/60px 60px;
 box-shadow:0 30px 80px rgba(124,92,252,.25);display:flex;align-items:center;justify-content:center;position:relative}
.card img{width:760px;filter:drop-shadow(0 20px 30px rgba(0,0,0,.25));transform:rotate(-4deg)}
.badge{position:absolute;top:-34px;right:-20px;background:linear-gradient(135deg,#FF9F43,#FF6B9D);color:#fff;font-family:Fredoka;font-weight:600;font-size:44px;padding:18px 36px;border-radius:999px;transform:rotate(6deg)}
h2{font-family:Fredoka;font-weight:600;font-size:76px;margin-top:80px}
.styles{display:flex;gap:26px;margin-top:40px}
.chip{font-size:34px;font-weight:800;padding:18px 34px;border-radius:999px;background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.08)}
.chip.on{background:#1a1a2e;color:#fff}
.btn{margin-top:70px;width:100%;height:190px;border-radius:60px;background:linear-gradient(135deg,#7C5CFC,#FF6B9D);color:#fff;font-family:Fredoka;font-weight:700;font-size:72px;display:flex;align-items:center;justify-content:center;gap:30px;box-shadow:0 24px 60px rgba(255,107,157,.45)}
.pay{margin-top:40px;font-size:36px;font-weight:800;opacity:.6;display:flex;gap:20px;align-items:center}
</style></head><body>
<div class="logo">MeSticker</div><div class="sub">snap • style • stick</div>
<div class="card"><img src="tex/s1.png"><div class="badge">✨ Chibi</div></div>
<h2>You look amazing.</h2>
<div class="styles"><span class="chip">Simpsons</span><span class="chip on">Chibi</span><span class="chip">Pixar</span><span class="chip">Anime</span></div>
<div class="btn">Print my sticker · $5</div>
<div class="pay">⟟ Tap card or phone below  ·  Apple Pay  ·  Google Pay</div>
</body></html>
