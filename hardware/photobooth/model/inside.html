<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0}body{width:1080px;height:1920px;overflow:hidden;font-family:Nunito;color:#1a1a2e;background:radial-gradient(ellipse at top,#EDE7FF 0%,#FEFCFF 50%,#FFE9F2 100%);display:flex;flex-direction:column;align-items:center;padding:120px 80px}
.logo{font-family:Fredoka;font-weight:700;font-size:84px;background:linear-gradient(135deg,#7C5CFC,#FF6B9D);-webkit-background-clip:text;color:transparent}
.strip{margin-top:70px;display:grid;grid-template-columns:1fr 1fr;gap:26px;background:#fff;padding:36px;border-radius:50px;box-shadow:0 30px 80px rgba(124,92,252,.25)}
.strip img{width:330px;height:330px;object-fit:contain}
h2{font-family:Fredoka;font-weight:600;font-size:88px;margin-top:80px;text-align:center;line-height:1.05}
.styles{display:flex;gap:20px;margin-top:40px}.chip{font-size:36px;font-weight:800;padding:18px 34px;border-radius:999px;background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.08)}.on{background:#1a1a2e;color:#fff}
.tap{margin-top:70px;width:100%;border-radius:60px;background:linear-gradient(135deg,#7C5CFC,#FF6B9D);color:#fff;padding:46px;text-align:center;box-shadow:0 24px 60px rgba(255,107,157,.45)}
.tap b{display:block;font-family:Fredoka;font-size:76px}.tap span{font-size:40px;font-weight:800;opacity:.9}
.arrow{margin-top:40px;font-size:44px;font-weight:900;color:#7C5CFC}</style></head><body>
<div class="logo">MeSticker</div>
<div class="strip"><img src="tex/sticker.png"><img src="tex/sticker2.png"><img src="tex/sticker4.png"><img src="tex/sticker.png"></div>
<h2>Your strip<br>is ready.</h2>
<div class="styles"><span class="chip">Cartoon</span><span class="chip on">Chibi</span><span class="chip">Anime</span><span class="chip">Pixel</span></div>
<div class="tap"><b>Tap to pay · $10</b><span>card, Apple Pay or Google Pay</span></div>
<div class="arrow">↘ reader is to the right</div>
</body></html>
