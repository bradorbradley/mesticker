<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0}body{width:1080px;height:1920px;overflow:hidden;font-family:Nunito;background:linear-gradient(160deg,#2B1A6B 0%,#7C5CFC 45%,#FF6B9D 80%,#FF9F43 100%);color:#fff;display:flex;flex-direction:column;align-items:center;padding:110px 70px}
.logo{font-family:Fredoka;font-weight:700;font-size:120px;letter-spacing:-2px}
.tag{font-size:46px;font-weight:800;opacity:.9;margin-top:4px}
.grid{margin-top:80px;display:grid;grid-template-columns:repeat(3,280px);gap:28px}
.grid img{width:280px;height:300px;object-fit:contain;filter:drop-shadow(0 16px 24px rgba(0,0,0,.35))}
.grid img:nth-child(odd){transform:rotate(-6deg)}.grid img:nth-child(even){transform:rotate(5deg)}
h2{font-family:Fredoka;font-weight:700;font-size:104px;line-height:1;text-align:center;margin-top:90px}
.price{margin-top:60px;background:#fff;color:#2B1A6B;font-family:Fredoka;font-weight:700;font-size:70px;padding:28px 60px;border-radius:999px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.step{margin-top:60px;font-size:50px;font-weight:900}</style></head><body>
<div class="logo">MeSticker</div><div class="tag">the AI sticker booth</div>
<div class="grid"><img src="tex/sticker.png"><img src="tex/sticker2.png"><img src="tex/sticker4.png"><img src="tex/sticker2.png"><img src="tex/sticker4.png"><img src="tex/sticker.png"></div>
<h2>Turn your crew<br>into stickers</h2><div class="price">$10 · strip of 4</div><div class="step">Step inside →</div>
</body></html>
