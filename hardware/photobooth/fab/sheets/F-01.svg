<text x="32.0" y="777.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#1F1B2E" text-anchor="start">• F-05 Steel frame + tube cut list · F-06 Panel drawings · F-07 Panel schedule + sheet nesting · F-08 Electrical + data · F-09 Details · F-10 Assembly</text><rect x="12" y="12" width="1608" height="1032" fill="none" stroke="#1F1B2E" stroke-width="1.6"/><line x1="12" y1="978" x2="1620" y2="978" stroke="#1F1B2E" stroke-width="1.2"/><text x="28" y="1006" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" fill="#1F1B2E">MeSticker Photo Booth</text><text x="28" y="1028" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#8A84A3">Fabrication drawing set · units mm · do not scale drawings, use dimensions · tolerance ±2 mm unless noted</text><line x1="992" y1="978" x2="992" y2="1044" stroke="#1F1B2E" stroke-width="1"/><text x="1002" y="1000" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#8A84A3">SHEET</text><text x="1002" y="1026" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" fill="#1F1B2E">F-01</text><line x1="1082" y1="978" x2="1082" y2="1044" stroke="#1F1B2E" stroke-width="1"/><text x="1092" y="1000" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#8A84A3">TITLE</text><text x="1092" y="1026" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="800" fill="#1F1B2E">General arrangement</text><line x1="1412" y1="978" x2="1412" y2="1044" stroke="#1F1B2E" stroke-width="1"/><text x="1422" y="1000" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#8A84A3">REV</text><text x="1422" y="1026" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="800" fill="#1F1B2E">A</text><line x1="1482" y1="978" x2="1482" y2="1044" stro