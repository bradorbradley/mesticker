<rect x="872.0" y="400.0" width="728.0" height="162.0" rx="0" fill="none" stroke="#D9D4E8" stroke-width="0.8" opacity="1"/>
<text x="872.0" y="592.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="700" fill="#8A84A3" text-anchor="start">CONSTRUCTION</text>
<text x="872.0" y="610.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#1F1B2E" text-anchor="start">• Frame: 1.5&quot; (38.1 mm) square steel tube, 16 ga, MIG welded, powder-coated</text>
<text x="884.0" y="626.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#1F1B2E" text-anchor="start">black. See F-05.</text>
<text x="872.0" y="646.3" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#1F1B2E" text-anchor="start">• Skins: 3 mm aluminum composite panel (ACM), riveted or VHB-bonded to the</text>
<text x="884.0" y="663.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#1F1B2E" text-anchor="start">frame, gloss plum outside, gloss white on the camera wall. See F-06.</text>
<text x="872.0" y="682.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#1F1B2E" text-anchor="start">• The machine module is one welded frame on 4 locking casters. The bay is 5</text>
<text x="884.0" y="699.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#1F1B2E" text-anchor="start">bolt-together sub-frames (end, back, front, floor, roof), joined to the</text>
<text x="884.0" y="716.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#1F1B2E" text-anchor="start">machine posts with M8 bolts. See F-09.</text>
<text x="872.0" y="735.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#1F1B2E" text-anchor="start">• All electronics live in the machine module, behind a locked service door on</text>
<text x="884.0" y="752.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#1F1B2E" text-anchor="start">its end wall. One power cord goes to the wall. See F-04 and F-08.</text>
<text x="872.0" y="772.1" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#1F1B2E" text-anchor="start">• The marquee sign is a separate box that bolts to the roof frame and plugs in.</text>
<text x="32.0" y="740.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="700" fill="#8A84A3" text-anchor="start">SHEET INDEX</text>
