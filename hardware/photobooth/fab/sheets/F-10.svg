<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1632 1056" width="1632" height="1056"><rect width="1632" height="1056" fill="#fff"/><text x="32" y="50" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="800" fill="#1F1B2E">F-10 · Assembly sequence</text><text x="32" y="74" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8A84A3">Exploded view: machine module (purple frame) stays whole. Bay sub-frames and panels bolt on at the venue</text><image x="32" y="92" width="900" height="675" href="img/fab_exploded_labeled.png" preserveAspectRatio="xMidYMid slice"/>
<rect x="32.0" y="92.0" width="900.0" height="675.0" rx="0" fill="none" stroke="#D9D4E8" stroke-width="1.4" opacity="1"/>
<image x="952" y="92" width="648" height="486" href="img/fab_frame_w.png" preserveAspectRatio="xMidYMid slice"/>
<rect x="952.0" y="92.0" width="648.0" height="486.0" rx="0" fill="none" stroke="#D9D4E8" stroke-width="1.4" opacity="1"/>
<text x="952.0" y="596.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#8A84A3" text-anchor="start">Frame + equipment, panels off</text>
<text x="952.0" y="630.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="700" fill="#8A84A3" text-anchor="start">BUILD ORDER (SHOP)</text>
<text x="952.0" y="648.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#1F1B2E" text-anchor="start">• Weld the machine frame (M). Fit the caster plates, VESA plates and the printer shelf.</text>
<text x="964.0" y="664.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#1F1B2E" text-anchor="start">Powder-coat.</text>
<text x="952.0" y="684.3" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#1F1B2E" text-anchor="start">• Weld the 5 bay sub-frames. Test-fit them to M with M8 bolts, then mark and unbolt.</text>
<text x="952.0" y="704.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#1F1B2E" text-anchor="start">• Cut the panels from DXF (F-06, F-07). Dry-fit, then rivet or VHB-bond the M panels.</text>
<text x="964.0" y="720.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#1F1B2E" text-anchor="start">Bay panels go on their sub-frames.</text>
<text x="952.0" y="740.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#1F1B2E" text-anchor="start">• Fit the electronics in M (F-04 B, F-08). Run the LED leads through the tubes.</text>
<text x="964.0" y="757.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#1F1B2E" text-anchor="start">Bench-test the whole booth.</text>
<text x="32.0" y="800.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="700" fill="#8A84A3" text-anchor="start">INSTALL (VENUE)</text>
<text x="32.0" y="818.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#1F1B2E" text-anchor="start">• Roll the machine module in. Bolt the bay end, back and front frames to it, then the floor and roof joists. Drop in the floor deck and bench.</text>
<text x="32.0" y="837.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#1F1B2E" text-anchor="start">• Hang the bay panels and liners, then the roof panels. Lift the sign on and plug it in. Hang the curtain. Level all corners with the levelers, then</text>
<text x="44.0" y="854.3" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500" fill="#1F1B2E" text-anchor="start">lock the casters.</text><rect x="12" y="12" width="1608" height="1032" fill="none" stroke="#1F1B2E" stroke-width="1.6"/><line x1="12" y1="978" x2="1620" y2="978" stroke="#1F1B2E" stroke-width="1.2"/><text x="28" y="1006" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" fill="#1F1B2E">MeSticker Photo Booth</text><text x="28" y="1028" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#8A84A3">Fabrication drawing set · units mm · do not scale drawings, use dimensions · tolerance ±2 mm unless noted</text><line x1="992" y1="978" x2="992" y2="1044" stroke="#1F1B2E" stroke-width="1"/><text x="1002" y="1000" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#8A84A3">SHEET</text><text x="1002" y="1026" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" fill="#1F1B2E">F-10</text><line x1="1082" y1="978" x2="1082" y2="1044" stroke="#1F1B2E" stroke-width="1"/><text x="1092" y="1000" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#8A84A3">TITLE</text><text x="1092" y="1026" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="800" fill="#1F1B2E">Assembly sequence</text><line x1="1412" y1="978" x2="1412" y2="1044" stroke="#1F1B2E" stroke-width="1"/><text x="1422" y="1000" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#8A84A3">REV</text><text x="1422" y="1026" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="800" fill="#1F1B2E">A</text><line x1="1482" y1="978" x2="1482" y2="1044" stroke="#1F1B2E" stroke-width="1"/><text x="1492" y="1000" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#8A84A3">DATE</text><text x="1492" y="1026" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="800" fill="#1F1B2E">2026-10-24</text></svg>