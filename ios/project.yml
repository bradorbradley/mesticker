# XcodeGen spec: `brew install xcodegen && xcodegen` creates MeSticker.xcodeproj
name: MeSticker
options:
  bundleIdPrefix: fun.mesticker
  deploymentTarget:
    iOS: "16.0"
targets:
  MeSticker:
    type: application
    platform: iOS
    sources:
      - path: MeSticker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fun.mesticker.booth
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MeSticker/Info.plist
        CODE_SIGN_STYLE: Automatic
        # DEVELOPMENT_TEAM: set in Xcode (Signing & Capabilities) or here
